[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
extra_scripts = pre:scripts/prepare_web.py
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
lib_deps =
  fastled/FastLED
  bblanchon/ArduinoJson
  ESP32Async/AsyncTCP
  ESP32Async/ESPAsyncWebServer
