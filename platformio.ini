[env:esp32dev]
; Exact versions keep local builds, CI and release builds identical. Update
; them deliberately and run `pio run` plus the tests before tagging a release.
platform = espressif32 @ 7.0.0
board = esp32dev
framework = arduino
extra_scripts = pre:scripts/prepare_web.py
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
lib_deps =
  fastled/FastLED @ 3.10.3
  bblanchon/ArduinoJson @ 7.4.3
  ESP32Async/AsyncTCP @ 3.5.0
  ESP32Async/ESPAsyncWebServer @ 3.12.1
