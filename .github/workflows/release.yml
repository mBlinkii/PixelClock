name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish, for example v0.1.5"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.release_tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Release tag must look like v0.1.5, got: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Read versions
        id: versions
        shell: bash
        run: |
          firmware_version="$(sed -nE 's/^#define[[:space:]]+FIRMWARE_VERSION_TEXT[[:space:]]+"([^"]+)".*/\1/p' src/app_state.h)"
          littlefs_version="$(sed -nE 's/.*PIXEL_CLOCK_LITTLEFS_VERSION=([^"'"'"';]+).*/\1/p' data/updates.js | head -n 1)"

          if [[ -z "$firmware_version" ]]; then
            echo "Could not read firmware version from src/app_state.h" >&2
            exit 1
          fi

          if [[ -z "$littlefs_version" ]]; then
            echo "Could not read LittleFS version from data/updates.js" >&2
            exit 1
          fi

          if [[ "${{ steps.release.outputs.tag }}" != "v${firmware_version}" ]]; then
            echo "Release tag ${{ steps.release.outputs.tag }} does not match firmware version v${firmware_version}" >&2
            exit 1
          fi

          echo "firmware=$firmware_version" >> "$GITHUB_OUTPUT"
          echo "littlefs=$littlefs_version" >> "$GITHUB_OUTPUT"

      - name: Build firmware
        run: pio run

      - name: Build LittleFS image
        run: pio run --target buildfs

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp .pio/build/esp32dev/firmware.bin "release-assets/pixel-clock-firmware-v${{ steps.versions.outputs.firmware }}.bin"
          cp .pio/build/esp32dev/littlefs.bin "release-assets/pixel-clock-littlefs-v${{ steps.versions.outputs.littlefs }}.bin"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Pixel Clock ${{ steps.release.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*.bin
